<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendientes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../styles.css/todo-list.css">
</head>

<body>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Mis Tareas Pendientes</h2>
            <button class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#taskModal"
                onclick="openAddTaskModal()">
                Agregar Tarea
            </button>
        </div>

        <div class="row g-4" id="tasks-list">
        </div>

        <div class="mt-4">
            <a href="Principal.html" class="btn btn-secondary">Regresar al menú</a>
        </div>
    </div>

    <div class="modal fade" id="taskModal" tabindex="-1" aria-labelledby="taskModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content task-modal">
                <div class="modal-header">
                    <h5 class="modal-title" id="taskModalLabel">Nueva Tarea</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="task-form">
                        <input type="hidden" id="task-index" value="">

                        <div class="mb-3">
                            <label for="task-name" class="form-label">Nombre de la Tarea</label>
                            <input type="text" class="form-control" id="task-name" required>
                        </div>

                        <div class="mb-3">
                            <label for="task-type" class="form-label">Tipo de Tarea</label>
                            <select class="form-control" id="task-type" required>
                                <option value="">Selecciona un tipo</option>
                                <option value="Personal">Personal</option>
                                <option value="Trabajo">Trabajo</option>
                                <option value="Estudio">Estudio</option>
                                <option value="Hogar">Hogar</option>
                                <option value="Otro">Otro</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="task-urgency" class="form-label">Urgencia</label>
                            <select class="form-control" id="task-urgency" required>
                                <option value="">Selecciona urgencia</option>
                                <option value="Baja">Baja</option>
                                <option value="Media">Media</option>
                                <option value="Alta">Alta</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="task-date" class="form-label">Fecha de Entrega</label>
                            <input type="date" class="form-control" id="task-date" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-warning" onclick="saveTask()">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Js/todo-list.js"></script>
</body>

</html>
