<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Contacto</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">


    <link rel="stylesheet" href="../styles.css/NuevoContacto.css">
</head>
<body>

    <div class="container py-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Nuevo Contacto</h2>
            <a href="Principal.html" class="btn btn-secondary">Regresar</a>
        </div>

        <div class="row justify-content-center">
            <div class="col-12 col-md-6">

                <div class="contact-form-card">
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" placeholder="correo@ejemplo.com" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Nombre y apellido</label>
                            <input type="text" class="form-control" placeholder="Ingrese nombre y apellido" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Número de teléfono</label>
                            <input type="tel" class="form-control" placeholder="Ingrese el número de teléfono">
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Dirección</label>
                            <input type="text" class="form-control" placeholder="Ingrese la dirección">
                        </div>

                        <button type="button" class="btn btn-warning w-100">
                            Guardar contacto
                        </button>
                    </form>
                </div>

            </div>
        </div>

    </div>

</body>
</html>
