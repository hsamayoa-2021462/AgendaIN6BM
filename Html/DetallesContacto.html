<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles del Contacto</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../styles.css/DetallesContacto.Css">
    <style>
        .contact-card {
            cursor: pointer;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            transition: background-color 0.3s;
        }
        .contact-card:hover {
            background-color: #f8f9fa;
        }
        #contact-list, #contact-details {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container py-5">
        <h2>Mis Contactos</h2>
        <div class="row">
            <div class="col-md-4">
                <h4>Lista de Contactos</h4>
                <div id="contact-list"></div>
            </div>
            <div class="col-md-8">
                <h4>Detalles del Contacto</h4>
                <div id="contact-details">
                    <p>Selecciona un contacto para ver sus detalles.</p>
                </div>
            </div>
        </div>

        <a href="Principal.html" class="btn btn-warning mt-4">Regresar al menu</a>

    </div>

    <script src="../Js/Script.js"></script>
</body>
</html>
