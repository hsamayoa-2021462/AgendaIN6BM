<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles del Contacto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css/DetallesContacto.Css">
    <!-- Icono para la estrella para poder poner favoritos a los contactos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>

    <div class="container py-5">
        <h2>Mis Contactos</h2>
        <div class="row">
            <div class="col-md-4">
                <h4>Lista de Contactos</h4>
                <div id="contact-list"></div>
            </div>
            <div class="col-md-8">
                <h4>
                    Detalles del Contacto
                    <button id="favorite-btn" class="btn btn-link text-warning p-0 ms-2" style="font-size: 1.2rem;">
                        <i class="far fa-star"></i>
                    </button>
                </h4>
                <div id="contact-details">
                    <p>Selecciona un contacto para ver sus detalles.</p>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <a href="Favoritos.html" class="btn btn-info me-2">Ver Favoritos</a>
            <a href="Principal.html" class="btn btn-warning">Regresar al menú</a>
        </div>
    </div>

    <script src="../Js/Script.js"></script>
</body>

</html>
