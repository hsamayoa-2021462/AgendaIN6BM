<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil del Usuario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../styles.css/perfil.css">
</head>

<body>

    <div class="container py-5">
        <h2 class="text-center mb-4">Perfil del Usuario</h2>

        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="profile-card">
                    <div class="text-center mb-4">
                        <img id="profile-image" src="../Image/perfil.png" alt="Foto de perfil" class="profile-img">
                    </div>

                    <div class="profile-info">
                        <div class="info-item">
                            <strong>Usuario:</strong>
                            <span id="user-email">Cargando...</span>
                        </div>

                        <div class="info-item">
                            <strong>Fecha de inicio de sesión:</strong>
                            <span id="login-date">Cargando...</span>
                        </div>

                        <div class="info-item">
                            <strong>Hora de inicio de sesión:</strong>
                            <span id="login-time">Cargando...</span>
                        </div>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button id="logout-btn" class="btn btn-danger btn-lg">Cerrar Sesión</button>
                        <a href="Principal.html" class="btn btn-secondary btn-lg">Regresar al menú</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../Js/perfil.js"></script>
</body>

</html>
